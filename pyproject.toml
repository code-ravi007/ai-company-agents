[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company"
version = "1.0.0"
description = "An AI product team (manager, designer, developer, reviewer) for Claude Code and GitHub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.174",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
ai-company = "ai_company.cli:main"

[tool.setuptools.packages.find]
include = ["ai_company*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
